name: Build and Push Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: zembeakszerotrust01.azurecr.io
  IMAGE_NAME: zero-trust-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name zembeakszerotrust01

      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            -t $REGISTRY/$IMAGE_NAME:latest \
            ./app/backend

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
           resource-group: rg-aks-zero-trust-lab
           cluster-name: aks-zero-trust-lab
           admin: true

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/namespaces/zero-trust.yaml
          kubectl apply -f k8s/deployments/api.yaml
          kubectl apply -f k8s/services/api-service.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/zero-trust-api \
            -n zero-trust \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods -n zero-trust
          kubectl get service -n zero-trust    