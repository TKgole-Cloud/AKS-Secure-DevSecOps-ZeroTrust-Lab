apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-api
  namespace: zero-trust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero-trust-api

  template:
    metadata:
      labels:
        app: zero-trust-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: api
          image: zembeakszerotrust01.azurecr.io/zero-trust-api:latest

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"